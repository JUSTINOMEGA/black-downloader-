<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Downloader - FB, TikTok, IG, MovieBox</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:white;text-align:center;padding:20px}
.box{max-width:500px;margin:30px auto;background:#1a1a1a;padding:25px;border-radius:15px}
input{width:90%;padding:15px;border-radius:10px;border:none;margin:10px 0;font-size:16px}
button{width:95%;padding:15px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.icons span{font-size:13px;background:#2a2a2a;padding:6px 12px;border-radius:20px;margin:3px;display:inline-block}
#result{margin-top:20px;text-align:left}
a.down{display:block;background:#fff;color:#000;padding:12px;margin:8px 0;border-radius:8px;text-decoration:none;font-weight:bold;text-align:center}
</style>
</head>
<body>
<h1>Black Downloader</h1>
<p>Download from Facebook, TikTok, Instagram & MovieBox</p>
<div class="icons">
<span>Facebook</span><span>TikTok</span><span>Instagram</span><span>MovieBox</span>
</div>
<div class="box">
<input id="url" placeholder="Paste link here...">
<button onclick="getInfo()">Get Video</button>
<div id="result"></div>
</div>

<script>
async function getInfo(){
 let url = document.getElementById('url').value;
 if(!url){alert('Paste link'); return;}
 document.getElementById('result').innerHTML='Loading...';
 try{
  let res = await fetch('/info?url='+encodeURIComponent(url));
  let data = await res.json();
  if(data.error){document.getElementById('result').innerHTML=data.error; return;}
  let html = '<h3>'+data.title+'</h3>';
  data.formats.forEach(f=>{
   html += `<a class="down" href="${f.url}" target="_blank">Download ${f.quality}</a>`;
  });
  document.getElementById('result').innerHTML=html;
 }catch(e){
  document.getElementById('result').innerHTML='Error: '+e;
 }
}
</script>
</body>
</html>
