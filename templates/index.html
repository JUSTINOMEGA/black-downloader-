<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Downloader - Download Any Video No Watermark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:white;min-height:100vh;padding:15px}
.container{max-width:500px;margin:auto}
.header{text-align:center;padding:20px 0}
.header h1{font-size:28px;font-weight:900}
.header h1 span{color:#00ff88}
.badge{display:inline-block;background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:8px}
.card{background:#1a1a1a;border-radius:16px;padding:20px;margin-top:15px;border:1px solid #333}
.input-box{display:flex;background:#222;border-radius:10px;padding:5px;border:1px solid #444}
.input-box input{flex:1;background:transparent;border:none;color:white;padding:12px;outline:none}
.input-box button{background:#00ff88;color:#000;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px;text-align:center}
.platforms div{background:#222;padding:12px 5px;border-radius:10px;font-size:12px}
.platforms div span{font-size:20px;display:block}
.stats{display:flex;justify-content:space-around;margin-top:15px;background:#222;padding:12px;border-radius:10px;font-size:14px}
.result{display:none;margin-top:20px;text-align:center}
.result img{width:100%;border-radius:10px;max-height:250px;object-fit:cover}
.download-btns a{display:block;background:#00ff88;color:#000;padding:14px;border-radius:10px;margin-top:10px;text-decoration:none;font-weight:bold}
.error{color:#ff4444;margin-top:15px;text-align:center;display:none}
#live{position:fixed;top:10px;right:10px;background:green;color:white;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
<script data-cfasync="false" src="https://accountut.com/1/87e172de6eacde98194e479419b0040d"></script>
<script data-cfasync="false" src="https://bellnewyork.org/14/ec5cf818a8aaeaa6ab2ab10d72065ce4"></script>
</head>
<body>
<div id="live">🟢 <span id="online">{{ online }}</span> Online</div>

<div class="container">
<div class="header">
<h1><span>BLACK</span> DOWNLOADER</h1>
<div class="badge">🔥 NO WATERMARK</div>
<p style="margin-top:10px;color:#aaa;font-size:14px">Download Videos Fast & Free</p>
</div>

<div class="card">
<div class="input-box">
<input id="url" placeholder="Paste video link here...">
<button onclick="getVideo()">Paste</button>
</div>

<div class="platforms">
<div><span>🎵</span>TikTok</div>
<div><span>📘</span>Facebook</div>
<div><span>📸</span>Instagram</div>
<div><span>🐦</span>Twitter</div>
</div>

<div class="stats">
<div>📥 {{ total }} Downloads</div>
<div>👁️ {{ online }} Online</div>
</div>

<div id="error" class="error"></div>

<div id="result" class="result">
<img id="thumb" src="">
<h3 id="title" style="margin:15px 0"></h3>
<div id="btns" class="download-btns"></div>
</div>

<p style="text-align:center;color:#555;margin-top:20px;font-size:12px">Supported: TikTok, Facebook, Instagram, Twitter • No Watermark</p>
</div>

<script>
async function getVideo(){
 let url = document.getElementById('url').value.trim();
 if(!url){
   url = await navigator.clipboard.readText().catch(()=> '');
   document.getElementById('url').value = url;
   if(!url) return alert('Paste video link first');
 }
 document.getElementById('error').style.display='none';
 document.getElementById('result').style.display='none';
 document.getElementById('error').innerText='⏳ Loading...';
 document.getElementById('error').style.display='block';

 try{
  let res = await fetch('/info?url='+encodeURIComponent(url));
  let data = await res.json();
  if(data.error) throw new Error(data.error);
  
  document.getElementById('thumb').src = data.thumbnail;
  document.getElementById('title').innerText = data.title;
  let btnsHtml = '';
  data.formats.forEach(f=>{
    btnsHtml += `<a href="${f.url}" target="_blank" download>📥 Download ${f.quality} (${f.ext})</a>`;
  });
  document.getElementById('btns').innerHTML = btnsHtml;
  document.getElementById('result').style.display='block';
  document.getElementById('error').style.display='none';
 }catch(e){
  document.getElementById('error').innerText = e.message;
  document.getElementById('error').style.display='block';
 }
}
</script>
</body>
</html>
