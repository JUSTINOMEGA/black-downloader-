<!DOCTYPE html>
<html>
<head>
  <title>Black Downloader - No Watermark</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #000; color: #fff; }
    input { width: 90%; padding: 15px; border-radius: 10px; border: none; margin: 15px 0; }
    .download-btn { background: #00ff88; color: #000; padding: 15px 40px; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; }
    .download-btn:hover { background: #00cc6a; }
  </style>
</head>
<body>
  <h1>BLACK DOWNLOADER 🔥</h1>
  <p>Paste TikTok / FB / IG link</p>
  
  <input type="text" id="videoUrl" placeholder="Paste link here..." />
  <br>
  
  <!-- CORRECT BUTTON - NO AD LINK -->
  <button class="download-btn" onclick="handleDownload()">DOWNLOAD NOW ⬇️</button>
  
  <div id="status" style="margin-top:20px;"></div>

  <script>
    async function handleDownload() {
      const url = document.getElementById('videoUrl').value;
      const status = document.getElementById('status');
      
      if (!url) {
        alert('Paste link first!');
        return;
      }
      
      status.innerHTML = 'Downloading... ⏳';
      
      try {
        // Call your backend download API
        const response = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
        const data = await response.json();
        
        if (data.downloadUrl) {
          // Create real download
          const a = document.createElement('a');
          a.href = data.downloadUrl;
          a.download = 'video.mp4';
          a.click();
          status.innerHTML = 'Done! ✅ Check your gallery';
        } else {
          status.innerHTML = 'Failed. Try another link.';
        }
      } catch (e) {
        status.innerHTML = 'Error. Try again.';
      }
    }
  </script>

  <!-- PUT YOUR SOCIAL BAR AD CODE HERE LATER (IN FOOTER, NOT NEAR BUTTON) -->

</body>
</html>
