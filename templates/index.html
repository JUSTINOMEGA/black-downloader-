<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Video Downloader</title>
<style>
body{background:#0b0b0b;color:#fff;font-family:Arial;text-align:center;padding:20px}
input{width:90%;max-width:500px;padding:14px;border-radius:10px;border:none;font-size:16px}
button{padding:12px 25px;background:#ff0040;color:#fff;border:none;border-radius:10px;margin-top:10px;font-weight:bold;cursor:pointer}
.platforms{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}
.p{background:#1c1c1c;padding:12px 18px;border-radius:12px;width:110px;text-align:center;text-decoration:none;color:#fff;display:block}
.p span{font-size:28px;display:block;margin-bottom:5px}
#result{margin-top:25px}
a.down{display:block;background:#222;padding:10px;margin:8px auto;max-width:400px;border-radius:8px;color:#0f0;text-decoration:none}
</style>
</head>
<body>

<h2>🔥 BLACK VIDEO DOWNLOADER</h2>
<p id="stats">{{ total }} Downloads | {{ online }} Online</p>

<input id="url" placeholder="Paste video link here...">
<br>
<button onclick="getVideo()">DOWNLOAD</button>

<div class="platforms">
  <a class="p" href="https://facebook.com" target="_blank"><span>📘</span>Facebook</a>
  <a class="p" href="https://tiktok.com" target="_blank"><span>🎵</span>TikTok</a>
  <a class="p" href="https://instagram.com" target="_blank"><span>📸</span>Instagram</a>
  <a class="p" href="https://t.me" target="_blank"><span>✈️</span>Telegram</a>
  <a class="p" href="https://youtube.com" target="_blank"><span>▶️</span>YouTube</a>
  <a class="p" href="https://twitter.com" target="_blank"><span>🐦</span>Twitter</a>
</div>

<div id="result"></div>

<script>
async function getVideo(){
  let u = document.getElementById('url').value.trim();
  if(!u){ alert("Paste link first"); return; }
  document.getElementById('result').innerHTML = "Loading...";
  try{
    let res = await fetch('/info?url=' + encodeURIComponent(u));
    let data = await res.json();
    if(data.error){ document.getElementById('result').innerHTML = data.error; return; }
    let html = `<h3>${data.title}</h3>`;
    if(data.thumbnail) html += `<img src="${data.thumbnail}" style="width:90%;max-width:400px;border-radius:10px"><br>`;
    data.formats.forEach(f=>{
      html += `<a class="down" href="${f.url}" target="_blank">Download ${f.quality} - ${f.ext}</a>`;
    });
    document.getElementById('result').innerHTML = html;
  }catch(e){
    document.getElementById('result').innerHTML = "Error: " + e;
  }
}
</script>

</body>
</html>
