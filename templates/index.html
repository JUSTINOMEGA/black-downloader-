<style>
body{margin:0;font-family:Arial,sans-serif;background:#0a0a0a;color:#fff;text-align:center}
.header{padding:15px;background:#111;display:flex;justify-content:space-between;align-items:center}

<div class="header">

<script>
// FLUCTUATING LIVE COUNTER - 128 up and down
let count = 128;
function fluctuate() {
  const change = Math.random() > 0.5 ? 1 : -1;
  const amount = Math.floor(Math.random() * 2) + 1;
  count += change * amount;
  if(count < 120) count = 125;
  if(count > 140) count = 135;
  document.getElementById('liveCount').innerText = '● ' + count + ' ONLINE';
  document.getElementById('totalUsers').innerText = count;
}
setInterval(fluctuate, 2000);

// Download logic
function handleDownload() {
  setTimeout(() => {
    let url = document.getElementById('videoUrl').value;
    if(!url){ alert('Paste link first'); return; }
    // your actual download function here

  }, 1200);
}
</script>
