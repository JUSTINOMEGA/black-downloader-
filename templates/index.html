<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Downloader</title>
<style>body{font-family:Arial;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.box{background:#111;padding:30px;border-radius:15px;width:100%;max-width:400px;text-align:center;border:1px solid #333}input{width:100%;padding:15px;border-radius:10px;border:none;margin:15px 0;box-sizing:border-box}button{width:100%;padding:15px;background:#fe2c55;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}#msg{margin-top:15px;font-size:14px}</style>
</head>
<body>
<div class="box">
<h2>BLACK DOWNLOADER</h2>
<input id="url" placeholder="Paste TikTok link here">
<button id="btn" onclick="downloadNow()">DOWNLOAD NOW</button>
<div id="msg"></div>
</div>
<script>
async function downloadNow(){
  const u = document.getElementById('url').value.trim();
  const b = document.getElementById('btn');
  const m = document.getElementById('msg');
  if(!u){m.innerHTML="❌ Paste link";return;}
  b.disabled=true; b.innerText="Getting..."; m.innerHTML="⏳ Wait...";
  try{
    const res = await fetch(`/api/download?url=${encodeURIComponent(u)}`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    m.innerHTML="✅ Downloading... Check gallery!";
    // Use proxy - this will FORCE download to system
    window.location.href = data.proxyUrl;
  }catch(e){ m.innerHTML="❌ "+e.message; }
  finally{ b.disabled=false; b.innerText="DOWNLOAD NOW"; }
}
</script>
</body>
</html>
